name: Mention Trigger

on:
  # Check for mentions hourly during the day (8am-10pm UTC)
  schedule:
    - cron: '0 8-22 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean

permissions: write-all

jobs:
  check-mentions:
    runs-on: ubuntu-latest
    # Only runs on schedule and manual dispatch — agent.yml handles all local events directly
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for new mentions
        id: check-mentions
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
        run: |
          # Use PAT_TOKEN which has access to notifications across repos
          TOKEN="${PAT_TOKEN:-$GITHUB_TOKEN}"
          
          echo "🔍 Checking for @agent-of-mkmeral mentions..."
          echo "   Trigger: ${{ github.event_name }}"
          
          # Fetch unread notifications (mentions show up as notifications)
          NOTIFICATIONS=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/notifications?all=false&participating=true&per_page=50")
          
          if [ "$DEBUG" = "true" ]; then
            echo "Raw notifications response:"
            echo "$NOTIFICATIONS" | jq '.'
          fi
          
          # Filter for mention notifications
          MENTIONS=$(echo "$NOTIFICATIONS" | jq -r '
            [.[] | select(
              .reason == "mention" or 
              .reason == "team_mention"
            )] | 
            map({
              id: .id,
              reason: .reason,
              repository: .repository.full_name,
              subject_type: .subject.type,
              subject_title: .subject.title,
              subject_url: .subject.url,
              updated_at: .updated_at,
              unread: .unread
            })
          ')
          
          MENTION_COUNT=$(echo "$MENTIONS" | jq 'length')
          echo "📬 Found $MENTION_COUNT potential mentions/notifications"
          
          if [ "$MENTION_COUNT" -gt 0 ]; then
            echo "has_mentions=true" >> $GITHUB_OUTPUT
            echo "mentions<<EOF" >> $GITHUB_OUTPUT
            echo "$MENTIONS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            echo ""
            echo "📋 Mentions found:"
            echo "$MENTIONS" | jq -r '.[] | "  - [\(.repository)] \(.subject_type): \(.subject_title) (reason: \(.reason))"'
          else
            echo "has_mentions=false" >> $GITHUB_OUTPUT
            echo "✅ No new mentions to process"
          fi

      - name: Process mentions
        if: steps.check-mentions.outputs.has_mentions == 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MENTIONS: ${{ steps.check-mentions.outputs.mentions }}
          AUTHORIZED_USERS: ${{ vars.AUTHORIZED_USERS }}
        run: |
          TOKEN="${PAT_TOKEN:-$GITHUB_TOKEN}"
          
          echo "🚀 Processing mentions..."
          
          # ============================================================
          # Authorization check function
          # Verifies the mentioning user is in the AUTHORIZED_USERS list
          # ============================================================
          is_authorized() {
            local author="$1"
            if [ -z "$author" ] || [ "$author" = "null" ]; then
              return 1  # Not authorized (unknown user)
            fi
            if [[ ",$AUTHORIZED_USERS," == *",$author,"* ]]; then
              return 0  # Authorized
            else
              return 1  # Not authorized
            fi
          }
          
          # Process each mention
          echo "$MENTIONS" | jq -c '.[]' | while read -r mention; do
            REPO=$(echo "$mention" | jq -r '.repository')
            SUBJECT_TYPE=$(echo "$mention" | jq -r '.subject_type')
            SUBJECT_URL=$(echo "$mention" | jq -r '.subject_url')
            NOTIFICATION_ID=$(echo "$mention" | jq -r '.id')
            TITLE=$(echo "$mention" | jq -r '.subject_title')
            REASON=$(echo "$mention" | jq -r '.reason')
            
            echo ""
            echo "📌 Processing: [$REPO] $SUBJECT_TYPE - $TITLE (reason: $REASON)"
            
            # Skip notifications from our own repo — agent.yml handles those via direct event triggers
            if [ "$REPO" = "${{ github.repository }}" ]; then
              echo "  ⏭️ Skipping own-repo notification (handled by agent.yml direct triggers)"
              # Still mark as read to avoid reprocessing on next poll
              curl -s -X PATCH \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/notifications/threads/$NOTIFICATION_ID"
              continue
            fi
            
            # Get the actual issue/PR content
            CONTENT=$(curl -s -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$SUBJECT_URL")
            
            BODY=$(echo "$CONTENT" | jq -r '.body // ""')
            NUMBER=$(echo "$CONTENT" | jq -r '.number')
            MENTION_AUTHOR=""
            MENTION_SOURCE=""
            
            # ============================================================
            # Search all locations for @agent-of-mkmeral mention + author
            # ============================================================
            
            # Check 1: Issue/PR body
            if echo "$BODY" | grep -qi "@agent-of-mkmeral"; then
              MENTION_AUTHOR=$(echo "$CONTENT" | jq -r '.user.login // ""')
              MENTION_SOURCE="body"
              echo "  🔍 Found mention in body by @$MENTION_AUTHOR"
            fi
            
            # Check 2: Issue/PR comments
            if [ -z "$MENTION_AUTHOR" ]; then
              COMMENTS_URL=$(echo "$CONTENT" | jq -r '.comments_url // ""')
              if [ -n "$COMMENTS_URL" ] && [ "$COMMENTS_URL" != "null" ]; then
                LATEST_COMMENTS=$(curl -s -H "Authorization: Bearer $TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "${COMMENTS_URL}?per_page=20&sort=created&direction=desc")
                
                MENTION_COMMENT=$(echo "$LATEST_COMMENTS" | jq -r '
                  [.[] | select(.body | test("@agent-of-mkmeral"; "i"))] | last // empty
                ')
                
                if [ -n "$MENTION_COMMENT" ]; then
                  MENTION_AUTHOR=$(echo "$LATEST_COMMENTS" | jq -r '
                    [.[] | select(.body | test("@agent-of-mkmeral"; "i"))] | last | .user.login // ""
                  ')
                  MENTION_SOURCE="comment"
                  echo "  🔍 Found mention in comment by @$MENTION_AUTHOR"
                fi
              fi
            fi
            
            # Check 3: PR review bodies (APPROVED, COMMENTED, CHANGES_REQUESTED)
            if [ -z "$MENTION_AUTHOR" ] && [ "$SUBJECT_TYPE" = "PullRequest" ]; then
              REVIEWS_URL="${SUBJECT_URL}/reviews"
              REVIEWS=$(curl -s -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${REVIEWS_URL}?per_page=20")
              
              MENTION_REVIEW=$(echo "$REVIEWS" | jq -r '
                [.[] | select(.body != null and .body != "" and 
                  (.body | test("@agent-of-mkmeral"; "i")))] | last // empty
              ')
              
              if [ -n "$MENTION_REVIEW" ]; then
                MENTION_AUTHOR=$(echo "$REVIEWS" | jq -r '
                  [.[] | select(.body != null and .body != "" and 
                    (.body | test("@agent-of-mkmeral"; "i")))] | last | .user.login // ""
                ')
                REVIEW_STATE=$(echo "$REVIEWS" | jq -r '
                  [.[] | select(.body != null and .body != "" and 
                    (.body | test("@agent-of-mkmeral"; "i")))] | last | .state // ""
                ')
                MENTION_SOURCE="review ($REVIEW_STATE)"
                echo "  🔍 Found mention in PR review by @$MENTION_AUTHOR"
              fi
            fi
            
            # Check 4: PR review line comments (code-level comments)
            if [ -z "$MENTION_AUTHOR" ] && [ "$SUBJECT_TYPE" = "PullRequest" ]; then
              REVIEW_COMMENTS_URL="${SUBJECT_URL}/comments"
              REVIEW_COMMENTS=$(curl -s -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${REVIEW_COMMENTS_URL}?per_page=20&sort=created&direction=desc")
              
              MENTION_LINE_COMMENT=$(echo "$REVIEW_COMMENTS" | jq -r '
                [.[] | select(.body != null and 
                  (.body | test("@agent-of-mkmeral"; "i")))] | last // empty
              ')
              
              if [ -n "$MENTION_LINE_COMMENT" ]; then
                MENTION_AUTHOR=$(echo "$REVIEW_COMMENTS" | jq -r '
                  [.[] | select(.body != null and 
                    (.body | test("@agent-of-mkmeral"; "i")))] | last | .user.login // ""
                ')
                LINE_COMMENT_PATH=$(echo "$REVIEW_COMMENTS" | jq -r '
                  [.[] | select(.body != null and 
                    (.body | test("@agent-of-mkmeral"; "i")))] | last | .path // ""
                ')
                MENTION_SOURCE="line comment on $LINE_COMMENT_PATH"
                echo "  🔍 Found mention in PR line comment by @$MENTION_AUTHOR"
              fi
            fi
            
            # ============================================================
            # Decision: Did we find a mention? Is the author authorized?
            # ============================================================
            
            if [ -z "$MENTION_AUTHOR" ]; then
              # No mention text found
              if [ "$REASON" = "mention" ] || [ "$REASON" = "team_mention" ]; then
                echo "  ⚠️ GitHub says reason='$REASON' but couldn't identify mentioning user — skipping for security"
              else
                echo "  ℹ️ No @agent-of-mkmeral mention found anywhere in $REPO#$NUMBER"
              fi
            elif is_authorized "$MENTION_AUTHOR"; then
              # ✅ Authorized — dispatch the agent
              echo "  ✅ @$MENTION_AUTHOR is AUTHORIZED — dispatching agent"
              
              # ============================================================
              # Extract the actual comment/review content for the dispatch prompt.
              # CRITICAL: without the actual content, the agent sees a generic
              # "I was mentioned" prompt, matches it against session history,
              # and dismisses it as a duplicate.
              # ============================================================
              MENTION_BODY=""
              
              if [ "$MENTION_SOURCE" = "comment" ]; then
                MENTION_BODY=$(echo "$LATEST_COMMENTS" | jq -r \
                  '[.[] | select(.body | test("@agent-of-mkmeral"; "i"))] | last | .body // ""' \
                  2>/dev/null || echo "")
              elif [ "$MENTION_SOURCE" = "body" ]; then
                MENTION_BODY="$BODY"
              elif echo "$MENTION_SOURCE" | grep -q "^review"; then
                MENTION_BODY=$(echo "$REVIEWS" | jq -r \
                  '[.[] | select(.body != null and .body != "" and (.body | test("@agent-of-mkmeral"; "i")))] | last | .body // ""' \
                  2>/dev/null || echo "")
              elif echo "$MENTION_SOURCE" | grep -q "^line comment"; then
                MENTION_BODY=$(echo "$REVIEW_COMMENTS" | jq -r \
                  '[.[] | select(.body != null and (.body | test("@agent-of-mkmeral"; "i")))] | last | .body // ""' \
                  2>/dev/null || echo "")
              fi
              
              # Truncate to avoid workflow_dispatch input limits (65535 chars)
              if [ ${#MENTION_BODY} -gt 2000 ]; then
                MENTION_BODY="${MENTION_BODY:0:2000}... (truncated)"
              fi
              
              echo "  📝 Comment body extracted (${#MENTION_BODY} chars)"
              
              # Build URL
              if [ "$SUBJECT_TYPE" = "PullRequest" ]; then
                DISPATCH_URL="https://github.com/$REPO/pull/$NUMBER"
              else
                DISPATCH_URL="https://github.com/$REPO/issues/$NUMBER"
              fi
              
              # Build rich prompt with actual content + timestamp
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              PROMPT_FILE=$(mktemp)
              if [ -n "$MENTION_BODY" ]; then
                printf '%s\n' "NEW mention at $TIMESTAMP by @$MENTION_AUTHOR in $MENTION_SOURCE of $REPO#$NUMBER." \
                  "URL: $DISPATCH_URL" "" \
                  "What @$MENTION_AUTHOR said:" "$MENTION_BODY" "" \
                  "This is a NEW trigger with new content above. Do NOT dismiss as duplicate." \
                  "Check the PR/issue for all recent comments and reviews, then respond appropriately." \
                  > "$PROMPT_FILE"
              else
                printf '%s\n' "NEW mention at $TIMESTAMP by @$MENTION_AUTHOR in $MENTION_SOURCE of $REPO#$NUMBER." \
                  "URL: $DISPATCH_URL" "" \
                  "This is a NEW trigger. Do NOT dismiss as duplicate." \
                  "Check the PR/issue for the latest comments and reviews, then respond appropriately." \
                  > "$PROMPT_FILE"
              fi
              
              # session ID (same as before)
              REPO_SLUG=$(echo "$REPO" | tr '/' '-')
              if [ "$SUBJECT_TYPE" = "PullRequest" ]; then
                SESSION_ID="gh-${REPO_SLUG}-pr-${NUMBER}"
              else
                SESSION_ID="gh-${REPO_SLUG}-issue-${NUMBER}"
              fi
              echo "  📎 Session ID: $SESSION_ID"
              
              # Use jq for safe JSON encoding
              PAYLOAD=$(jq -n \
                --arg ref "main" \
                --arg prompt "$(cat "$PROMPT_FILE")" \
                --arg session_id "$SESSION_ID" \
                '{ref: $ref, inputs: {prompt: $prompt, session_id: $session_id}}')
              rm -f "$PROMPT_FILE"
              
              curl -s -X POST \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/agent.yml/dispatches" \
                -d "$PAYLOAD"
              
              echo "  ✅ Workflow dispatched for authorized user @$MENTION_AUTHOR"
            else
              # 🚫 Not authorized — skip
              echo "  🚫 @$MENTION_AUTHOR is NOT authorized — skipping dispatch"
              echo "  ℹ️ Only authorized users can trigger the agent via mentions"
            fi
            
            # Mark notification as read (always, regardless of auth)
            echo "  📖 Marking notification as read..."
            curl -s -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/notifications/threads/$NOTIFICATION_ID"
            
          done
          
          echo ""
          echo "✅ All mentions processed"

      - name: Summary
        run: |
          echo "## Mention Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Has Mentions:** ${{ steps.check-mentions.outputs.has_mentions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Schedule:** Hourly (8am-10pm UTC) + reactive on @mentions" >> $GITHUB_STEP_SUMMARY
